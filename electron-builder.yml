appId: com.arspective.gtd
productName: Arspective GTD
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
win:
  icon: build/GTD.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Arspective GTD
  include: build/installer.nsh
  guid: "c8e6dfd1-3ab7-4fb8-9c10-2cb03dc698f1"
  artifactName: Arspective GTD Setup ${version}.${ext}
portable:
  artifactName: Arspective-GTD-Portable-${version}.${ext}
