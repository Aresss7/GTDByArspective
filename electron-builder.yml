appId: com.arspective.gtd
productName: Arspective GTD
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Arspective GTD
  artifactName: Arspective GTD Setup ${version}.${ext}
portable:
  artifactName: Arspective-GTD-Portable-${version}.${ext}
